services:
  hideck:
    image: ${HIDECK_IMAGE:?Run the HiDeck installer first}
    container_name: hideck
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    network_mode: host
    privileged: true
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - /dev:/dev
    environment:
      TZ: Asia/Shanghai
      CONFIG_PATH: /app/config/config.yaml
      PROXY_SERVER_PORT: ${HIDECK_PORT:-7575}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:$${PROXY_SERVER_PORT:-7575}/ping || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
